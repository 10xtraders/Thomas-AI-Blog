name: Deploy

on:
  push:
    branches: [master]
    paths:
      - "apps/**"
      - "packages/**"
      - "ecosystem.config.cjs"
      - "package-lock.json"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency: deploy-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh deploy@${{ secrets.DEPLOY_HOST }} 'bash -se' <<'EOF'
          set -euo pipefail
          cd /home/deploy/thomas-ai-blog
          git fetch origin master && git reset --hard origin/master
          npm ci --no-audit --no-fund
          npm run build --workspace=packages/shared --if-present
          npm run build --workspace=apps/api
          NEXT_PUBLIC_API_URL=https://api.lisbonyacht.com npm run build --workspace=@ace/admin
          pm2 reload ecosystem.config.cjs --update-env
          pm2 save
          EOF

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            curl -fsS https://api.lisbonyacht.com/health | grep -q '"ok":true' && echo "api ok" && exit 0
            sleep 3
          done
          exit 1
